<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SW Asia Quiz Helper (Multiple Choice)</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f0f4f8;
      margin: 0;
      padding: 20px;
      color: #333;
    }
    .container {
      max-width: 700px;
      margin: auto;
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
    }
    h1 {
      text-align: center;
      font-size: 24px;
    }
    .question-box {
      margin-top: 20px;
    }
    .question {
      font-size: 18px;
      margin-bottom: 10px;
    }
    .choice {
      display: block;
      background-color: #e8f5e9;
      border: none;
      padding: 10px;
      margin: 5px 0;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .choice:hover {
      background-color: #c8e6c9;
    }
    #feedback {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>SW Asia Quiz Practice</h1>
    <div class="question-box">
      <div class="question" id="question"></div>
      <div id="choices"></div>
      <div id="feedback"></div>
    </div>
  </div>

  <script>
    const facts = {
      "What is an ethnic group?": "A group sharing culture, ancestry, language, and traditions.",
      "What is a religious group?": "A group sharing common beliefs and practices around religion.",
      "Can people of the same religion be in different ethnic groups?": "Yes",
      "What are the 3 major ethnic groups in Southwest Asia?": "Arabs, Persians, Kurds",
      "What are the 3 major religions in Southwest Asia?": "Judaism, Christianity, Islam",
      "Which ethnic group mainly speaks Arabic?": "Arabs",
      "Which ethnic group mainly lives in Iran?": "Persians",
      "Who are the largest ethnic group without a country?": "Kurds",
      "What religion do most Arabs follow?": "Islam",
      "What religion do most Persians follow?": "Shi'a Islam",
      "What religion do most Kurds follow?": "Sunni Islam",
      "What language do Persians speak?": "Farsi",
      "What language do Kurds speak?": "Kurdish",
      "Where do Kurds live?": "Turkey, Syria, Iraq, Iran",
      "What language do Arabs speak?": "Arabic",
      "Who are Arabs descended from?": "Abraham through Ishmael",
      "What sacred text does Judaism follow?": "Torah",
      "What sacred text does Christianity follow?": "Bible",
      "What sacred text does Islam follow?": "Quran",
      "What is the name of the Islamic prophet?": "Muhammad",
      "Where is the Kaaba located?": "Mecca",
      "What are the two main branches of Islam?": "Sunni and Shi'a",
      "Which branch is most common among Arabs?": "Sunni",
      "What is the Five Pillars of Islam?": "Core practices of Islam",
      "Who founded Christianity?": "Jesus",
      "Who founded Judaism?": "Abraham",
      "Who founded Islam?": "Muhammad",
      "What year did Iraq invade Kuwait?": "1990",
      "What was the U.S. response to Iraq invading Kuwait?": "Operation Desert Storm",
      "What was Iraq's goal in Kuwait?": "Oil and Gulf access",
      "What did the UN do after Iraq invaded Kuwait?": "Embargo",
      "What does embargo mean?": "Ban on trade",
      "Why did the U.S. invade Iraq in 2003?": "WMDs and terrorism",
      "What was the name of the 2003 Iraq operation?": "Operation Iraqi Freedom",
      "Who was the Iraqi dictator during the conflicts?": "Saddam Hussein",
      "When was Saddam Hussein captured?": "2003",
      "What happened to Saddam Hussein?": "Executed",
      "What terrorist group attacked the U.S. on 9/11?": "Al-Qaeda",
      "Who led al-Qaeda?": "Osama bin Laden",
      "What country was invaded after 9/11?": "Afghanistan",
      "What was the operation called in Afghanistan?": "Operation Enduring Freedom",
      "What group ruled Afghanistan before the U.S. invasion?": "Taliban",
      "What was the U.S. goal in Afghanistan?": "Defeat Taliban and get bin Laden",
      "When was bin Laden killed?": "2011",
      "Where was bin Laden found?": "Pakistan",
      "Why is oil important in SW Asia?": "Drives economy",
      "Why is there conflict among Muslims in Iraq?": "Sunni vs Shi'a",
      "When did the U.S. leave Iraq?": "2011",
      "What year did the U.S. invade Afghanistan?": "2001"
    };

    const allAnswers = Object.values(facts);
    const questions = Object.keys(facts);
    let currentIndex = 0;

    const questionDiv = document.getElementById("question");
    const choicesDiv = document.getElementById("choices");
    const feedback = document.getElementById("feedback");

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
    }

    function showQuestion() {
      const question = questions[currentIndex];
      const correct = facts[question];

      questionDiv.innerText = question;
      feedback.innerText = "";
      choicesDiv.innerHTML = "";

      const choices = [correct];
      while (choices.length < 4) {
        const option = allAnswers[Math.floor(Math.random() * allAnswers.length)];
        if (!choices.includes(option)) choices.push(option);
      }
      shuffle(choices);

      choices.forEach(choice => {
        const btn = document.createElement("button");
        btn.className = "choice";
        btn.innerText = choice;
        btn.onclick = () => checkAnswer(choice, correct);
        choicesDiv.appendChild(btn);
      });
    }

    function checkAnswer(selected, correct) {
      if (selected === correct) {
        feedback.innerText = "✅ Correct!";
      } else {
        feedback.innerText = `❌ Incorrect. Correct answer: ${correct}`;
      }
      currentIndex = (currentIndex + 1) % questions.length;
      setTimeout(showQuestion, 2000);
    }

    showQuestion();
  </script>
</body>
</html>
